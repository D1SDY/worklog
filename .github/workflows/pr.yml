name: PR

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Clear stale verdict labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for label in needs-fix ready-for-approval review-blocked review-cap-reached; do
            gh pr edit "${{ github.event.pull_request.number }}" --remove-label "$label" || true
          done
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: dart tool/ci/coverage_check.dart coverage/lcov.info .github/coverage-floor

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/worklog/pr-${{ github.event.pull_request.number }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  preview:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build
      - id: publish
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          rm -rf "pages/pr-$PR"
          mkdir -p "pages/pr-$PR"
          cp -r web-build/. "pages/pr-$PR/"
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: preview for PR #$PR" || echo "nothing to commit"

          # Multiple PRs can publish to gh-pages concurrently; each writes only
          # to its own pr-<N>/ directory, so a rebase on top of a concurrent
          # push is conflict-free by construction. Retry with fetch+rebase
          # instead of relying on concurrency grouping (which is per-PR here).
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push; then
              pushed=true
              break
            fi
            echo "Push rejected (attempt $attempt/5) — fetching and rebasing onto origin/gh-pages"
            git fetch origin gh-pages
            if ! git rebase origin/gh-pages; then
              git rebase --abort
              echo "::error::rebase onto origin/gh-pages conflicted; aborting rather than resolving blindly" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

          if [ "$pushed" != "true" ]; then
            echo "::error::gh-pages push could not be fast-forwarded after 5 attempts" >&2
            exit 1
          fi

          echo "url=https://d1sdy.github.io/worklog/pr-$PR/" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "Preview: ${{ steps.publish.outputs.url }}"
