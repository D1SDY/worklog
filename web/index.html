<!DOCTYPE html>
<html lang="uk">
<head>
  <!--
    Replaced by the value of `flutter build web --base-href`: /worklog/ for
    develop, /worklog/pr-<N>/ for pull requests.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Журнал тренувань: записуйте підходи, відстежуйте прогрес і особисті рекорди.">
  <meta name="theme-color" content="#0F1419">

  <!-- iOS: launch fullscreen from the home screen, drawing under the status bar. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Worklog">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Workout Logger</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Flutter web reports zero view padding, so SafeArea cannot keep content
    clear of the notch and the home indicator. Inset the Flutter host element
    by the safe-area insets instead, and paint the uncovered strips in the
    colour of the surface they border: --bg-primary under the status bar,
    --bg-secondary (the bottom navigation bar) under the home indicator.
  -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom, #0F1419 50%, #1A2332 50%);
    }
    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      background: #0F1419;
    }
  </style>

  <!-- Restores a deep link handed over by 404.html before the router reads the URL. -->
  <script>
    (function () {
      var route = new URLSearchParams(window.location.search).get('p');
      if (route !== null) {
        var target = new URL(route.replace(/^\/+/, ''), document.baseURI);
        window.history.replaceState(null, '', target.href + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
